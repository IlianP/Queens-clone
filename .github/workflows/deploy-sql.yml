name: SQL ausrollen

# docs/leaderboard-setup.sql in Supabase anwenden, sobald die Datei auf `main`
# landet — statt 650 Zeilen von Hand in den SQL-Editor zu kopieren.
#
# WARUM DAS GEHT: die Datei ist von Anfang an wiederholbar gebaut (alles ist
# `create or replace` bzw. `if not exists`, kein `drop table`, keine Migration,
# die nur einmal laufen darf). Sie mehrfach anzuwenden ist also folgenlos, und
# genau das macht sie automatisierbar — bei einer Datei mit einmaligen
# Migrationsschritten wäre dieser Workflow gefährlich statt praktisch.
#
# ALLES ODER NICHTS: `--single-transaction` plus `ON_ERROR_STOP=1`. PostgreSQL
# kann DDL in einer Transaktion, und die Datei enthält nichts, was das
# verhindert (kein CREATE INDEX CONCURRENTLY, kein VACUUM). Bricht irgendeine
# Anweisung ab, wird die ganze Datei zurückgerollt und die Datenbank steht
# unverändert da — geprüft, inklusive absichtlich kaputter Datei.
#
# EINRICHTUNG: ein Repository-Secret, SUPABASE_DB_URL.
#   Supabase → Project Settings → Database → Connection string → "Session pooler"
#   Beispiel: postgresql://postgres.<ref>:<passwort>@aws-0-<region>.pooler.supabase.com:5432/postgres
#
#   Den SESSION-Pooler nehmen (Port 5432), nicht den Transaction-Pooler (6543):
#   der hält keine Sitzung über mehrere Anweisungen und kann deshalb keine
#   Transaktion über die ganze Datei. Die direkte Verbindung (db.<ref>.supabase.co)
#   ist bei neueren Projekten nur über IPv6 erreichbar, GitHub-Runner sind IPv4 —
#   deshalb der Pooler.
#
#   Dieses Secret ist NICHT dasselbe wie SUPABASE_SERVICE_KEY (den benutzt der
#   Wochenbericht über die REST-Schnittstelle). Es ist das Datenbankpasswort und
#   darf nirgendwo sonst auftauchen.
#
# Ohne das Secret schlägt der Workflow mit einer klaren Meldung fehl, statt
# stillschweigend nichts zu tun — eine nicht ausgerollte Datenbank sieht sonst
# genauso aus wie eine ausgerollte.

on:
  push:
    branches: [main]
    paths:
      - 'docs/leaderboard-setup.sql'
      - '.github/workflows/deploy-sql.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur testen: anwenden und sofort zurückrollen'
        type: boolean
        default: false

permissions:
  contents: read

# Zwei Läufe gleichzeitig auf derselben Datenbank sind sinnlos und riskant.
# Nicht abbrechen, sondern anstellen: ein halb gelaufener Lauf wäre zwar durch
# die Transaktion abgesichert, aber warten ist trotzdem das Richtige.
concurrency:
  group: supabase-sql
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: psql bereitstellen
        run: psql --version || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      - name: Secret prüfen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Das Repository-Secret SUPABASE_DB_URL fehlt. Siehe den Kopf dieser Datei."
            exit 1
          fi

      # Erst ein Probelauf gegen die echte Datenbank: die ganze Datei anwenden
      # und garantiert zurückrollen. Damit scheitert ein Syntaxfehler oder ein
      # fehlendes Recht, BEVOR irgendetwas festgeschrieben wird — auch wenn die
      # Transaktion unten das ohnehin abfangen würde. Der Unterschied ist die
      # Fehlermeldung: hier steht sie isoliert im Log.
      - name: Probelauf (anwenden und zurückrollen)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          { echo 'BEGIN;'; cat docs/leaderboard-setup.sql; echo 'ROLLBACK;'; } \
            | psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --quiet

      - name: Anwenden
        if: ${{ github.event_name == 'push' || inputs.dry_run != true }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction --quiet \
            -f docs/leaderboard-setup.sql

      # Nachkontrolle, ohne eine einzige Zeile zu schreiben: die Größengrenzen
      # werden aus dem Quelltext der INSTALLIERTEN Funktionen gelesen und gegen
      # MAX_SIZE aus js/settings.js gehalten. Das ist die eine Zahl, die sich
      # zwischen Client und Server unbemerkt auseinanderentwickeln kann — und
      # bei bump_stat wäre die Folge stilles Datenverlieren, kein Fehler.
      - name: Nachkontrolle (schreibfrei)
        if: ${{ github.event_name == 'push' || inputs.dry_run != true }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          max_size=$(node -e "import('./js/settings.js').then(m => console.log(m.MAX_SIZE))")
          echo "MAX_SIZE laut js/settings.js: $max_size"
          bounds=$(psql "$SUPABASE_DB_URL" -qtA -v ON_ERROR_STOP=1 -c "
            select p.proname || '=' || (regexp_match(p.prosrc, '(?:p_size|v_size) > (\d+)'))[1]
              from pg_proc p join pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public' and p.proname in ('submit_score', 'bump_stat')
             order by 1;")
          echo "$bounds"
          bad=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            [ "${line##*=}" = "$max_size" ] || { echo "::error::$line — erwartet $max_size"; bad=1; }
          done <<< "$bounds"
          [ "$bad" -eq 0 ] || exit 1
          {
            echo "### SQL ausgerollt"
            echo ""
            echo "\`docs/leaderboard-setup.sql\` angewendet, Größengrenzen stimmen mit \`MAX_SIZE = $max_size\` überein:"
            echo ""
            echo '```'
            echo "$bounds"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
