name: Wochenbericht

# Einmal pro Woche einen Aktivitätsbericht über die globale Rangliste als Issue
# anlegen; die Benachrichtigungsmail von GitHub IST die wöchentliche Mail. Kein
# SMTP, kein Drittanbieter, kein Passwort, das ablaufen kann.
#
# PRIVAT: dieses Repository ist öffentlich — Issues, Job-Zusammenfassungen und
# Logs darin kann jeder lesen. Der Bericht enthält Spielernamen und Gerätezahlen
# und geht deshalb ausschließlich in ein separates, PRIVATES Repository
# (Repository-Variable REPORT_REPO). Ist es nicht gesetzt, bricht der Lauf ab —
# er fällt bewusst NICHT auf dieses Repository zurück. Dass das Ziel wirklich
# privat ist, wird am Ziel selbst nachgefragt, nicht aus dem Namen geschlossen:
# ein zweites *öffentliches* Repository wäre sonst genauso durchgegangen, und
# „nicht erreichbar" gilt dabei als nicht privat. Aus demselben Grund schreibt
# der Testlauf (dry_run) den Berichtstext nicht in die Zusammenfassung.
#
# Der Bericht selbst entsteht in tools/weekly-report.mjs und ist deterministisch
# (gleiche Zeilen + gleiches Fenster = gleicher Text). Dieser Workflow tut nur
# drei Dinge: den letzten Bericht finden, das Skript laufen lassen, das Ergebnis
# als Issue schreiben.
#
# ZUSTAND: der ausgewertete Zeitraum beginnt dort, wo der letzte Bericht endete.
# Dieser Zeitpunkt steht als HTML-Kommentar im Text des letzten Bericht-Issues
# (Schritt "Letzten Bericht suchen" holt ihn, das Skript liest ihn; beides im
# privaten Berichts-Repository). Absichtlich
# nicht als Datei im Repo: `main` ist geschützt, ein Bot-Push scheitert dort am
# Statuscheck, und ein Commit auf `main` würde über deploy.yml jede Woche die
# Seite neu ausrollen. Der Zeitraum rückt so außerdem genau dann weiter, wenn
# ein Bericht auch wirklich zugestellt wurde: bricht ein Lauf vorher ab, deckt
# der nächste beide Wochen ab statt eine zu verlieren.
#
# EINRICHTUNG (Details in docs/weekly-report.md):
#  - Secret SUPABASE_SERVICE_KEY — ein Secret key (`sb_secret_…`, bevorzugt)
#    oder der Legacy-service_role-Key des Supabase-Projekts. Er umgeht RLS und
#    darf deshalb NIE in den Browser — nur hier.
#  - Variable REPORT_REPO — das private Berichts-Repository, `owner/name`.
#  - Secret REPORT_GITHUB_TOKEN — Fine-grained Personal Access Token, nur auf
#    REPORT_REPO, Berechtigung "Issues: Read and write" (sonst nichts).

on:
  schedule:
    # Montags 06:00 UTC = 08:00 MESZ / 07:00 MEZ. GitHub-Cron läuft in UTC und
    # kann sich bei Last um einige Minuten verspäten; für einen Wochenbericht
    # ist das folgenlos, weil das Fenster am tatsächlichen Laufzeitpunkt endet.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur anzeigen (Job-Zusammenfassung), kein Issue anlegen'
        type: boolean
        default: false
      window_days:
        description: 'Fenster in Tagen, falls kein früherer Bericht existiert'
        type: string
        default: '7'

permissions:
  contents: read

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Konfiguration vorhanden?
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REPORT_GITHUB_TOKEN: ${{ secrets.REPORT_GITHUB_TOKEN }}
          REPORT_REPO: ${{ vars.REPORT_REPO }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::Das Repository-Secret SUPABASE_SERVICE_KEY fehlt. Siehe docs/weekly-report.md."
            exit 1
          fi
          if [ -z "$REPORT_REPO" ] || [ -z "$REPORT_GITHUB_TOKEN" ]; then
            echo "::error::Variable REPORT_REPO und/oder Secret REPORT_GITHUB_TOKEN fehlen. Der Bericht geht nur in ein privates Repository, nie in dieses. Siehe docs/weekly-report.md."
            exit 1
          fi
          case "$REPORT_REPO" in
            "${GITHUB_REPOSITORY}")
              echo "::error::REPORT_REPO ist dieses (öffentliche) Repository. Es muss ein separates, privates sein."
              exit 1 ;;
            */*) ;;
            *) echo "::error::REPORT_REPO muss die Form owner/name haben."; exit 1 ;;
          esac

      - name: Zielrepository privat?
        uses: actions/github-script@v7
        env:
          REPORT_REPO: ${{ vars.REPORT_REPO }}
        with:
          github-token: ${{ secrets.REPORT_GITHUB_TOKEN }}
          script: |
            // "nicht dieses Repository" ist nicht dasselbe wie "privat": ein
            // zweites öffentliches Repo, oder eines, das nachträglich öffentlich
            // gestellt wurde, würde den Bericht samt Spielernamen publizieren.
            // Also am Ziel nachfragen. Früh im Job, damit auch der Testlauf die
            // Fehlkonfiguration zeigt, statt sie bis zum Montag zu verstecken.
            const { assertPrivate } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/report-target.js`);
            await assertPrivate(github, core, process.env.REPORT_REPO);

      - name: Letzten Bericht suchen
        uses: actions/github-script@v7
        env:
          REPORT_REPO: ${{ vars.REPORT_REPO }}
        with:
          github-token: ${{ secrets.REPORT_GITHUB_TOKEN }}
          script: |
            // Der jüngste Bericht liefert den Startzeitpunkt des Fensters. Gesucht
            // wird über das Label, nicht über den Titel: ein Label lässt sich nicht
            // versehentlich umformulieren. Findet sich keiner (erster Lauf, Issue
            // gelöscht), bleibt die Datei leer und das Skript fällt auf sein
            // Standardfenster zurück.
            const fs = require('fs');
            const [owner, repo] = process.env.REPORT_REPO.split('/');
            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'all',
              labels: 'wochenbericht',
              sort: 'created',
              direction: 'desc',
              per_page: 5,
            });
            const last = issues.data.find((i) => !i.pull_request && i.body && i.body.includes('queens-report-state'));
            fs.writeFileSync('/tmp/last-report.md', last ? last.body : '');
            core.info(last ? `Letzter Bericht: #${last.number} (${last.title})` : 'Kein früherer Bericht gefunden.');

      - name: Bericht erzeugen
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node tools/weekly-report.mjs \
            --state /tmp/last-report.md \
            --out-body /tmp/report-body.md \
            --out-title /tmp/report-title.txt \
            --window-days "${{ inputs.window_days || '7' }}"

      - name: Issue anlegen
        if: ${{ inputs.dry_run != true }}
        uses: actions/github-script@v7
        env:
          REPORT_REPO: ${{ vars.REPORT_REPO }}
        with:
          github-token: ${{ secrets.REPORT_GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const title = fs.readFileSync('/tmp/report-title.txt', 'utf8').trim();
            const body = fs.readFileSync('/tmp/report-body.md', 'utf8');
            // Zweite Prüfung unmittelbar vor dem Schreiben: der Schritt oben ist
            // die schnelle, deutliche Fehlermeldung, diese hier ist das Gatter,
            // das bestehen bleibt, wenn jemand Schritte dazwischen einfügt.
            const { assertPrivate } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/report-target.js`);
            const { owner, repo } = await assertPrivate(github, core, process.env.REPORT_REPO);
            const target = { owner, repo };
            // Das Label trägt den Zustand von Woche zu Woche — es muss existieren,
            // sonst findet der nächste Lauf seinen Vorgänger nicht mehr.
            try {
              await github.rest.issues.getLabel({ ...target, name: 'wochenbericht' });
            } catch (err) {
              if (err.status !== 404) throw err;
              await github.rest.issues.createLabel({
                ...target,
                name: 'wochenbericht',
                color: '0e8a16',
                description: 'Automatischer Wochenbericht zur Spielaktivität',
              });
            }
            const issue = await github.rest.issues.create({
              ...target, title, body, labels: ['wochenbericht'],
            });
            // Nur die Nummer ins (öffentliche) Log, nie Titel oder Text.
            core.info(`Bericht angelegt: Issue #${issue.data.number} im privaten Berichts-Repository.`);

      - name: Nur prüfen (dry run)
        if: ${{ inputs.dry_run == true }}
        run: |
          # Bewusst ohne Berichtstext: Logs und Job-Zusammenfassungen dieses
          # öffentlichen Repositories kann jeder lesen.
          echo "Testlauf OK — Bericht erzeugt ($(wc -c < /tmp/report-body.md) Zeichen), nichts angelegt, Zeitraum nicht weitergerückt."
          echo "Den Text siehst du lokal mit: node tools/weekly-report.mjs --out-body bericht.md"
